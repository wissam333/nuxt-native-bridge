name: Publish module

on:
  push:
    branches: [main]
    paths:
      - 'packages/nuxt-native-bridge/src/**'
      - 'packages/nuxt-native-bridge/package.json'
      - '.github/workflows/publish-module.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nuxt-native-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - name: Publish if the version is new
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, skipping publish."
          else
            npm publish --access public
          fi

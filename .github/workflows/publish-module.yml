name: Publish module

on:
  push:
    branches: [main]
    paths:
      - 'packages/nuxt-native-bridge/src/**'
      - 'packages/nuxt-native-bridge/package.json'
      - '.github/workflows/publish-module.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # The package declares `workspaces: [playground]` for local dev, and the
      # playground uses the pnpm-only `workspace:*` protocol. Stage a copy
      # without it so plain npm can install and publish the package itself.
      - name: Stage the package
        run: |
          mkdir "$RUNNER_TEMP/module"
          cp -R packages/nuxt-native-bridge/. "$RUNNER_TEMP/module"
          node -e "const fs=require('fs');const f=process.env.RUNNER_TEMP+'/module/package.json';const p=JSON.parse(fs.readFileSync(f));delete p.workspaces;fs.writeFileSync(f,JSON.stringify(p,null,2))"

      - run: npm install --no-audit --no-fund
        working-directory: ${{ runner.temp }}/module
      - run: npx nuxt-module-build prepare
        working-directory: ${{ runner.temp }}/module
      - run: npm test
        working-directory: ${{ runner.temp }}/module
      - run: npm run lint
        working-directory: ${{ runner.temp }}/module
      - name: Publish if the version is new
        working-directory: ${{ runner.temp }}/module
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, skipping publish."
          else
            npm publish --access public
          fi

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // nnb:maven-mirrors — generated from nativeBridge.android.mavenMirrors, rewritten by nnb sync
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        // /nnb:maven-mirrors
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// nnb:build-tools — generated by nnb sync; library modules read the pin from variables.gradle
subprojects {
    afterEvaluate { proj ->
        def a = proj.extensions.findByName('android')
        if (a != null && rootProject.ext.has('buildToolsVersion')) a.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
}
// /nnb:build-tools

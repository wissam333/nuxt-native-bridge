dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // Aliyun mirrors first: dl.google.com / mavenCentral binaries are
        // unreachable on some networks (same ruling as the electron mirror).
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}

// nnb:bridge-library — generated wiring, rewritten by nnb sync
include ':nnb-bridge'
project(':nnb-bridge').projectDir = new File('../../../adapter-capacitor/android')
// /nnb:bridge-library

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'